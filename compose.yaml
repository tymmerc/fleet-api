# Environnement de développement : l'API et sa base de données.
# Version du professeur, adaptée au VPS (voir les deux lignes "VPS" ci-dessous).
#
#   docker compose up -d --build
#   curl http://127.0.0.1:8088/health     (ou https://dev.tymmerc.eu/td/health)
#   docker compose down -v          (le -v supprime aussi le volume)

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fleet
    # VPS : pas de "ports" ici. Le 5432 de la machine est celui de la base de
    # production de Blindz, et l'API joint la base par le réseau de compose (db:5432).
    volumes:
      # PostgreSQL 18+ : le point de montage a changé. PGDATA vaut désormais
      # /var/lib/postgresql/18/docker, et le volume se monte un cran au-dessus.
      # Monter /var/lib/postgresql/data (la convention d'avant) fait échouer
      # le démarrage avec « unused mount/volume ».
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Sans ce healthcheck, l'API démarre avant que PostgreSQL n'accepte
      # les connexions, et échoue une fois sur deux.
      test: ["CMD-SHELL", "pg_isready -U app -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/fleet
    ports:
      # VPS : publié en local seulement, sur le port réservé au TD (nginx le
      # relaie vers https://dev.tymmerc.eu/td/).
      - "127.0.0.1:8088:8000"
    depends_on:
      db:
        # « démarré » ne suffit pas : on attend « en bonne santé ».
        condition: service_healthy

volumes:
  pgdata:
